version: 1

benchmarks:
  - name: mmlu
    paths: ["${MMLU_EVAL_PATH}"]
    text_fields: [question, choices, answer]
    required: true
  - name: ceval
    paths: ["${CEVAL_EVAL_PATH}"]
    text_fields: [question, A, B, C, D, answer]
    required: true
  - name: cmmlu
    paths: ["${CMMLU_EVAL_PATH}"]
