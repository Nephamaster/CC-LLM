version: 1

benchmarks:
  - name: mmlu
    paths: ["/share/project/wuhaiming/data/dataset/mmlu/*/test-00000-of-00001.parquet"]
    text_fields: [question, choices, answer]
    required: true
  - name: ceval
    paths: ["/share/project/wuhaiming/data/dataset/ceval/*/test-00000-of-00001.parquet"]
    text_fields: [question, A, B, C, D, answer]
    required: true
  - name: cmmlu
    paths: ["/share/project/wuhaiming/data/dataset/cmmlu/test/*.csv"]
    text_fields: [Question, A, B, C, D, Answer]
    required: true
  - name: clue
    paths: ["/share/project/wuhaiming/data/dataset/clue/*/test-00000-of-00001.parquet"]
    text_fields: [sentence, sentence1, sentence2, text, context, question, choice, candidates, content, abst, keyword, answers, answer, target]
    required: true
  - name: arc
    paths: ["/share/project/wuhaiming/data/dataset/arc/ARC-Challenge/test-00000-of-00001.parquet"]
    text_fields: [question, choices, answerKey]
    required: true
  - name: gsm8k
    paths: ["/share/project/wuhaiming/data/dataset/gsm8k/main/test-00000-of-00001.parquet"]
    text_fields: [question, answer]
    required: true
  - name: humaneval
    paths: ["${HUMANEVAL_EVAL_PATH}"]
    text_fields: [prompt, canonical_solution, test]
    required: false
  - name: mbpp
    paths: ["${MBPP_EVAL_PATH}"]
    text_fields: [text, code, test_list]
    required: false
  - name: csc
    paths:
      - "/share/project/wuhaiming/data/dataset/lemon/lemon_v2/*.txt"
      - "/share/project/wuhaiming/data/dataset/cscd-ns/test.tsv"
    text_fields: [text, source, target]
    required: true
  - name: cgec
    paths:
      - "/share/project/wuhaiming/data/dataset/FCGEC/FCGEC_test.json"
      - "/share/project/wuhaiming/data/dataset/NaCGEC/data/nacgec.test.ref.para"
    text_fields: [sentence, source, target]
    required: true
  - name: c3bench
    paths: ["${C3BENCH_EVAL_PATH}"]
    text_fields: [question, context, choices, answer]
    required: false
  - name: fuxi
    paths: ["/share/project/wuhaiming/data/dataset/FuxiBench/test_data/*.json"]
    text_fields: [instruction, input, output]
    required: true
