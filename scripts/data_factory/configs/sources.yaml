version: 2

sources:
  cci3_hq:
    homepage: https://www.modelscope.cn/datasets/BAAI/CCI3-HQ
    reader: jsonl
    adapter: cci3_hq
    paths:
      - /share/project/wuhaiming/data/dataset/CCI3-HQ/data/part_*.jsonl
    phases: [phase1, phase2]
    license: Apache-2.0
    quality_profile: curated_zh
    default_domain: general

  fineweb_edu_chinese:
    homepage: https://www.modelscope.cn/datasets/opencsg/Fineweb-Edu-Chinese-V2.2
    reader: parquet
    adapter: fineweb
    paths:
      - /share/project/wuhaiming/data/dataset/fineweb-edu-chinese-v2.2/4_5/*.parquet
    phases: [phase1, phase2]
    license: Apache-2.0
    quality_profile: curated_zh
    default_domain: knowledge

  wanjuan:
    homepage: https://www.modelscope.cn/datasets/Shanghai_AI_Laboratory/WanJuan1_dot_0
    reader: tar_jsonl
    adapter: wanjuan
    paths:
      - /share/project/wuhaiming/data/dataset/WanJuan1_dot_0/*/*.jsonl.tar.gz
    phases: [phase1, phase2]
    license: CC-BY-4.0
    quality_profile: broad_zh
    default_domain: general

  fineweb_edu_english:
    homepage: https://www.modelscope.cn/datasets/HuggingFaceFW/fineweb-edu
    reader: parquet
    adapter: fineweb
    paths:
      - /share/project/wuhaiming/data/dataset/fineweb-edu/sample/10BT/*.parquet
    phases: [phase1, phase2]
    license: ODC-By-1.0
    quality_profile: curated_en
    default_domain: general
    metadata:
      language_score_min: 0.90

  the_stack_v3:
    homepage: https://www.modelscope.cn/datasets/HuggingFaceCode/stack-v3-train
    reader: parquet
    adapter: stack_v3_train
    paths:
      - /share/project/wuhaiming/data/dataset/stack-v3-train/data/*.parquet
    phases: [phase1, phase2]
    license_mode: per_record
    license: ""
    quality_profile: code
    default_domain: code
    metadata:
      download_fraction: 0.10
      require_permissive_license: true
      inspect_scan_multiplier: 100

  chinese_cosmopedia:
    homepage: https://www.modelscope.cn/datasets/opencsg/chinese-cosmopedia
    reader: parquet
    adapter: generic_text
    paths:
      - /share/project/wuhaiming/data/dataset/chinese-cosmopedia/data/*.parquet
    phases: [phase2]
    license: OpenCSG-Community-License AND Apache-2.0
    quality_profile: curated_zh
    default_domain: knowledge

  wikipedia_zh:
    homepage: https://www.modelscope.cn/datasets/wikimedia/wikipedia
    reader: parquet
    adapter: generic_text
    paths:
      - /share/project/wuhaiming/data/dataset/wikipedia/20231201.zh/*.parquet
    phases: [phase2]
    license: CC-BY-SA-4.0
    quality_profile: curated_zh
    default_domain: knowledge

  fineweb_zhtw:
    homepage: https://www.modelscope.cn/datasets/voidful/fineweb-zhtw
    reader: parquet
    adapter: fineweb
    paths:
      - /share/project/wuhaiming/data/dataset/fineweb-zhtw/data/*.parquet
    phases: [phase1, phase2]
    license: ODC-By-1.0
    quality_profile: web_zh
    default_domain: knowledge

  wikisource:
    homepage: https://www.modelscope.cn/datasets/wikimedia/wikisource
    reader: parquet
    adapter: generic_text
    paths:
      - /share/project/wuhaiming/data/dataset/wikisource/20231201.zh/*.parquet
    phases: [phase1, phase2]
    license: CC-BY-SA-4.0
    quality_profile: classical
    default_domain: knowledge

  ect_krp:
    homepage: https://github.com/direct-phonology/ect-krp
    reader: text
    adapter: plain_text
    paths:
      - /share/project/wuhaiming/data/dataset/ect-krp-v1.1.0-txt/*/*.txt
    phases: [phase2]
    license: CC-BY-SA-4.0
    quality_profile: classical
    default_domain: knowledge

  fineweb2_multilingual:
    homepage: https://www.modelscope.cn/datasets/HuggingFaceFW/fineweb-2
    reader: parquet
    adapter: fineweb
    paths:
      - /share/project/wuhaiming/data/dataset/FineWeb2/data/jpn_Jpan/train/000_00000.parquet
      - /share/project/wuhaiming/data/dataset/FineWeb2/data/kor_Hang/train/000_00000.parquet
      - /share/project/wuhaiming/data/dataset/FineWeb2/data/vie_Latn/train/000_00000.parquet
      - /share/project/wuhaiming/data/dataset/FineWeb2/data/spa_Latn/train/000_00000.parquet
      - /share/project/wuhaiming/data/dataset/FineWeb2/data/rus_Cyrl/train/000_00000.parquet
      - /share/project/wuhaiming/data/dataset/FineWeb2/data/arb_Arab/train/000_00000.parquet
      - /share/project/wuhaiming/data/dataset/FineWeb2/data/hin_Deva/train/000_00000.parquet
    phases: [phase2]
    license: ODC-By-1.0
    quality_profile: web_multilingual
    default_domain: general

  openwebmath:
    homepage: https://www.modelscope.cn/datasets/jordangong/open-web-math
    reader: parquet
    adapter: openwebmath
    paths:
      - /share/project/wuhaiming/data/dataset/openwebmath/data/*.parquet
    phases: [phase1, phase2]
    license: ODC-By-1.0
    quality_profile: math
    default_domain: math

  peS2o:
    homepage: https://www.modelscope.cn/datasets/allenai/peS2o
    reader: zstd_jsonl
    adapter: pes2o
    paths:
      - /share/project/wuhaiming/data/dataset/peS2o/data/v2/*.zst
    phases: [phase2]
    license: ODC-By-1.0
    quality_profile: scientific
    default_domain: scientific
    metadata:
      required_source: s2orc
      inspect_scan_multiplier: 1000
